name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: test
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: "3.13"
      - name: Install package and dev dependencies
        run: python -m pip install -e ".[dev]"
      - name: Byte-compile
        run: python -m compileall -q src tests agent.py
      - name: Run unit tests
        run: pytest -q
      - name: Lint
        run: ruff check .

  image:
    name: image
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Build container image and smoke-test CLI
        run: |
          docker build -t nighthawk-omada-shim:ci .
          docker run --rm nighthawk-omada-shim:ci --version
